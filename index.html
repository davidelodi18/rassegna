  :root{
    --paper:#F1EEE3; --card:#F8F6EE; --ink:#1A1915; --muted:#6C6A5F;
    --faint:#9A9789; --rule:#CFCBBC; --rule2:#B7B2A1; --stamp:#8A281C;
    --shadow:rgba(20,19,16,.25); --veil:rgba(20,19,16,.42); --snip:#43413A;
  }
  html[data-theme="night"]{
    --paper:#16161A; --card:#1E1E23; --ink:#E8E4D9; --muted:#9A968A;
    --faint:#6B6860; --rule:#33323A; --rule2:#4A4854; --stamp:#D4735F;
    --shadow:rgba(0,0,0,.5); --veil:rgba(0,0,0,.6); --snip:#B4B0A4;
  }
  html[data-theme="night"] .selbar{background:#0E0E11;border-top:1px solid var(--rule);color:var(--ink);}
  html[data-theme="night"] .toast{background:#0E0E11;color:var(--ink);border:1px solid var(--rule);}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html,body{transition:background-color .25s ease,color .25s ease;}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .wrap{max-width:1120px;margin:0 auto;padding:0 26px 130px;}

  .plate{border-bottom:3px double var(--ink);padding-top:20px;}
  .plate .top{border-top:1px solid var(--ink);border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center;padding:5px 2px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
  .plate .name{text-align:center;font-family:'Newsreader',serif;font-weight:800;letter-spacing:-.02em;font-size:clamp(42px,7.5vw,78px);line-height:.9;margin:12px 0 6px;color:var(--ink);}
  .plate .motto{text-align:center;font-family:'Newsreader',serif;font-style:italic;font-size:15px;color:var(--muted);margin-bottom:12px;}

  /* ---- nastro servizi ---- */
  :root{--up:#1E6B47;--down:#A32B1C;}
  html[data-theme="night"]{--up:#5FBF8E;--down:#E0705C;}
  .tickerwrap{position:relative;}
  .tickerwrap::after{content:"";position:absolute;right:0;top:0;bottom:1px;width:42px;pointer-events:none;
    background:linear-gradient(90deg,transparent,var(--paper));}
  .ticker{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--rule);background:var(--paper);
    scroll-snap-type:x proximity;}
  .tk{scroll-snap-align:start;}
  .ticker::-webkit-scrollbar{display:none;}
  .tk{flex:0 0 auto;min-width:150px;max-width:280px;padding:10px 18px;border-right:1px solid var(--rule);display:flex;flex-direction:column;justify-content:center;gap:3px;height:64px;box-sizing:border-box;overflow:hidden;}
  .tk:first-child{padding-left:2px;}
  .tk:last-child{border-right:none;}
  .tk .lb{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);white-space:nowrap;}
  .tk .vl{font-family:'Newsreader',serif;font-weight:600;font-size:17px;line-height:1.1;display:flex;align-items:baseline;gap:8px;white-space:nowrap;}
  .tk .dl{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;}
  .tk .dl.up{color:var(--up);} .tk .dl.dn{color:var(--down);}
  .tk .hd{font-family:'Newsreader',serif;font-size:13.5px;line-height:1.25;color:var(--ink);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal;}
  .nxt{background:none;border:none;padding:2px 0 0;font-family:'IBM Plex Mono',monospace;font-size:9.5px;
    letter-spacing:.08em;color:var(--faint);align-self:flex-start;}
  .nxt:hover{color:var(--stamp);}
  .tk .hd:hover{text-decoration:underline;text-underline-offset:2px;}
  .tk.wide{min-width:230px;}
  .tk .hd{max-height:34px;}
  .tk .err{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--faint);}
  .tk .sk{height:17px;width:70%;background:var(--rule);border-radius:2px;opacity:.4;}
  @media (max-width:820px){
    .tickerwrap::after{display:none;}
    .ticker{flex-wrap:wrap;overflow-x:visible;}
    .tk{flex:1 1 46%;min-width:0;max-width:none;padding:9px 12px;border-bottom:1px solid var(--rule);height:60px;}
    .tk:nth-child(2n){border-right:none;}
    .tk.wide{flex:1 1 100%;border-right:none;height:auto;min-height:64px;}
    .tk.wide .hd{max-height:none;}
    .tk .vl{font-size:16px;}
    .tk .hd{-webkit-line-clamp:2;}
  }

  .secbar{display:flex;justify-content:center;flex-wrap:wrap;gap:2px;padding:9px 0;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--paper);z-index:30;}
  .secbar button{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;background:none;border:none;color:var(--muted);padding:4px 13px;position:relative;}
  .secbar button+button::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:1px;height:12px;background:var(--rule);}
  .secbar button:hover{color:var(--ink);}
  .secbar button.active{color:var(--stamp);font-weight:600;}
  .secbar .n{opacity:.5;margin-left:5px;font-size:9.5px;}

  .utility{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule);font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.05em;color:var(--faint);}
  .utility .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .utility .warn{color:var(--stamp);}
  .chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .chip-s{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;
    border:1px solid var(--rule);border-radius:999px;padding:3px 9px;color:var(--muted);background:none;white-space:nowrap;}
  .chip-s.ok{color:var(--up);border-color:var(--up);}
  .chip-s.new{color:var(--stamp);border-color:var(--stamp);}
  .chip-s.bad{color:var(--stamp);border-color:var(--stamp);cursor:pointer;}
  .chip-s.bad:hover{background:var(--stamp);color:#fff;}
  .chip-s.live{color:var(--stamp);border-color:var(--stamp);}
  .ib{background:none;border:1px solid var(--rule);border-radius:5px;padding:5px 9px;color:var(--ink);font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.05em;display:inline-flex;align-items:center;gap:5px;}
  .ib:hover{border-color:var(--ink);}
  .ib.sync{border-color:var(--stamp);color:var(--stamp);}
  .ib.spin svg{animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .avat{width:18px;height:18px;border-radius:50%;border:1px solid var(--rule);}

  .kick{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--stamp);margin-bottom:6px;}
  .meta{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:7px;}
  .meta .dot{color:var(--rule2);}
  .meta .letto{color:var(--faint);border:1px solid var(--rule);border-radius:3px;padding:0 5px;font-size:9px;}
  h1,h2,h3{font-family:'Newsreader',serif;letter-spacing:-.006em;margin:0;}
  .hl a:hover{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;}
  .snip{color:var(--snip);font-size:14px;line-height:1.5;margin:7px 0 0;}
  .clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
  .clamp4{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;}

  .acts{display:flex;gap:9px;align-items:center;margin-top:9px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;flex-wrap:wrap;}
  .acts button{background:none;border:none;padding:0;color:var(--muted);letter-spacing:inherit;}
  .acts button:hover{color:var(--ink);}
  .acts .primary{color:var(--stamp);font-weight:600;}
  .acts .sep{color:var(--rule2);}
  .acts .on{color:var(--stamp);font-weight:600;}
  .acts button:disabled{color:var(--faint);cursor:default;}

  .top{display:grid;grid-template-columns:2.05fr 1fr;border-bottom:2px solid var(--ink);}
  .lead{padding:22px 30px 26px 0;border-right:1px solid var(--rule2);}
  .lead .kick{font-size:11px;}
  .lead h1{font-weight:800;font-size:clamp(28px,3.6vw,44px);line-height:1.04;margin-bottom:4px;}
  .lead .snip{font-size:16px;line-height:1.55;margin-top:10px;}
  .aside{padding:22px 0 26px 26px;}
  .aside .h{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:4px;}
  .brief{padding:12px 0;border-bottom:1px solid var(--rule);}
  .brief:last-child{border-bottom:none;}
  .brief h3{font-weight:600;font-size:16px;line-height:1.2;}

  .section{padding:20px 0 4px;border-bottom:1px solid var(--rule);}
  .sechead{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .sechead button{font-family:'Newsreader',serif;font-weight:700;font-size:19px;color:var(--ink);background:none;border:none;padding:0;letter-spacing:.01em;text-transform:uppercase;}
  .sechead button:hover{color:var(--stamp);}
  .sechead .line{flex:1;height:1px;background:var(--rule2);}
  .sechead .more{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);cursor:pointer;}

  .cols{column-gap:26px;column-rule:1px solid var(--rule);}
  .cols.c3{column-count:3;}
  .cols.c2{column-count:2;}
  .colitem{break-inside:avoid;padding-bottom:18px;margin-bottom:18px;border-bottom:1px solid var(--rule);}
  .colitem:last-child{border-bottom:none;}
  .colitem h2{font-weight:600;font-size:18px;line-height:1.2;}
  .colitem .snip{font-size:13px;}


  /* ---- immagini ---- */
  .figure{display:block;position:relative;overflow:hidden;background:var(--rule);border-radius:2px;line-height:0;}
  .figure img{display:block;width:100%;height:100%;object-fit:cover;}

  html[data-theme="night"] .figure img{filter:brightness(.86) saturate(.92);}
  
  .read .figure img{filter:grayscale(1) opacity(.55);}

  .lead .figure{display:block;width:100%;aspect-ratio:16/9;margin-bottom:16px;}
  .lead .figure img{position:absolute;inset:0;}
  .lead .figure::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.07);}

  .colitem{display:flex;gap:14px;align-items:flex-start;}
  .colitem .txt{flex:1;min-width:0;}
  .colitem .figure{flex:0 0 84px;width:84px;height:84px;margin-top:2px;align-self:flex-start;}
  .colitem.nopic{display:block;}

  .saveditem .figure{flex:0 0 104px;width:104px;height:104px;}

  .secview .top{grid-template-columns:1fr;}
  .secview .lead{border-right:none;padding-right:0;}

  .searchbar{display:flex;align-items:center;gap:8px;border:1px solid var(--rule2);border-radius:8px;padding:2px 6px 2px 12px;margin:14px 0 6px;background:var(--card);}
  .searchbar input{flex:1;border:none;background:none;outline:none;color:var(--ink);font-family:'Newsreader',serif;font-size:19px;padding:10px 0;}
  .searchbar input::placeholder{color:var(--faint);font-style:italic;}
  .searchbar .clr{border:none;background:none;font-size:22px;color:var(--muted);line-height:1;padding:4px 8px;}
  .searchmeta{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
  .savedbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding:14px 0;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
  .savedbar .r{display:flex;gap:8px;}

  .empty{padding:70px 0;text-align:center;color:var(--muted);}
  .empty b{font-family:'Newsreader',serif;font-size:24px;color:var(--ink);display:block;margin-bottom:8px;}

  .selbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 22px;}
  .selbar .txt{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.05em;}
  .selbar .grp{display:flex;gap:8px;}
  .selbar button{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.04em;border:1px solid rgba(255,255,255,.35);background:none;color:inherit;border-radius:5px;padding:7px 12px;}
  .selbar button.go{background:var(--stamp);border-color:var(--stamp);color:#fff;}

  .backdrop{position:fixed;inset:0;background:var(--veil);z-index:60;}
  .panel{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);z-index:61;background:var(--card);border-left:2px solid var(--ink);display:flex;flex-direction:column;}
  .panel header{padding:18px 20px;border-bottom:1px solid var(--rule);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
  .panel header .lbl{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--stamp);margin-bottom:6px;}
  .panel header h3{font-family:'Newsreader',serif;font-weight:600;font-size:19px;margin:0;line-height:1.25;}
  .panel .x{background:none;border:none;font-size:22px;color:var(--muted);line-height:1;padding:2px 4px;}
  .panel .content{flex:1;overflow:auto;padding:20px;}
  .hintline{font-size:13px;color:var(--muted);margin:0 0 12px;line-height:1.5;}
  .promptbox{font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:1.55;white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:14px;color:var(--ink);}
  .panel .foot{border-top:1px solid var(--rule);padding:14px 20px;display:flex;gap:8px;}
  .panel .foot button{flex:1;border-radius:6px;padding:11px 14px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.05em;border:1px solid var(--ink);background:none;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;}
  .panel .foot button.go{background:var(--stamp);border-color:var(--stamp);color:#fff;}

  .ordlist{border:1px solid var(--rule);border-radius:8px;overflow:hidden;margin:4px 0 18px;}
  .ord{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 8px;border-bottom:1px solid var(--rule);background:var(--paper);transition:background .12s,transform .12s;}
  .ord .nm{flex:1;}
  .ord .grip{cursor:grab;color:var(--faint);font-size:16px;padding:6px 6px;touch-action:none;user-select:none;letter-spacing:-2px;}
  .ord .grip:active{cursor:grabbing;color:var(--ink);}
  .ord.dragging{opacity:.45;background:var(--card);}
  .ord.over{box-shadow:inset 0 2px 0 var(--stamp);background:var(--card);}
  .ord:last-child{border-bottom:none;}
  .ord .nm{font-family:'Newsreader',serif;font-size:15px;color:var(--ink);}
  .ord .btns{display:flex;gap:4px;}
  .ord .btns button{width:30px;height:30px;border:1px solid var(--rule);border-radius:6px;background:none;color:var(--ink);font-size:13px;line-height:1;}
  .ord .btns button:hover:not(:disabled){border-color:var(--ink);}
  .ord .btns button:disabled{opacity:.3;cursor:default;}
  .ord .btns .rm{color:var(--stamp);border-color:var(--rule);}
  .ord .btns .rm:hover{background:var(--stamp);color:#fff;border-color:var(--stamp);}
  .cat{display:flex;flex-wrap:wrap;gap:7px;margin:4px 0 18px;}
  .chip{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;
    border:1px solid var(--rule);border-radius:999px;padding:6px 12px;background:none;color:var(--muted);transition:.14s;}
  .chip:hover{border-color:var(--ink);color:var(--ink);}
  .chip.on{background:var(--stamp);border-color:var(--stamp);color:#fff;}
  .setlbl{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink);border-bottom:1px solid var(--rule);padding-bottom:6px;margin:22px 0 10px;}
  .setlbl:first-of-type{margin-top:0;}
  .set textarea{width:100%;font-family:'IBM Plex Mono',monospace;font-size:12.5px;border:1px solid var(--rule);border-radius:6px;padding:9px 11px;background:var(--paper);color:var(--ink);resize:vertical;min-height:240px;line-height:1.5;}
  .set textarea:focus{outline:none;border-color:var(--ink);}
  .set .hint{font-size:12px;color:var(--faint);margin:0 0 8px;line-height:1.45;}
  .set .save{margin-top:20px;background:var(--stamp);color:#fff;border:none;border-radius:6px;padding:11px 18px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.06em;width:100%;}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--paper);font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.04em;padding:11px 18px;border-radius:8px;box-shadow:0 6px 24px var(--shadow);}

  .read h1 a,.read h2 a,.read h3 a{color:var(--muted);}
  .read .snip{color:var(--faint);}

  @media (max-width:820px){
    .wrap{padding:0 16px 130px;}
    .secbar{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:0 -16px;padding:9px 16px;}
    .secbar::-webkit-scrollbar{display:none;}
    .secbar button{white-space:nowrap;padding:4px 11px;}
    .top{grid-template-columns:1fr;}
    .lead{border-right:none;padding:20px 0 22px;}
    .aside{padding:16px 0 22px;border-top:1px solid var(--rule);}
    .cols.c3{column-count:2;}
  }
  @media (max-width:540px){
    .cols.c3,.cols.c2{column-count:1;column-rule:none;}
    .lead h1{font-size:26px;}
    .colitem .figure,.saveditem .figure{flex:0 0 72px;width:72px;height:72px;}
    .colitem{gap:12px;}
    .acts{gap:8px;font-size:10.5px;}
    .acts button{padding:2px 0;}
  }
  .upd-banner{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:90;display:flex;align-items:center;gap:12px;
    background:var(--ink);color:var(--paper);font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.04em;padding:9px 10px 9px 16px;border-radius:10px;box-shadow:0 6px 24px var(--shadow);white-space:nowrap;}
  .upd-banner button{border:0;border-radius:6px;background:var(--stamp);color:#fff;font:600 12px 'IBM Plex Mono',monospace;padding:6px 12px;}
  .upd-banner button.x{background:transparent;color:inherit;opacity:.7;padding:6px 6px;}
  .upd-veil{position:fixed;inset:0;z-index:120;background:var(--veil);display:flex;align-items:center;justify-content:center;padding:22px;animation:updIn .2s ease;}
  .upd-pop{width:100%;max-width:360px;background:var(--card);color:var(--ink);border:1px solid var(--rule2);border-top:4px double var(--ink);border-radius:12px;padding:22px 22px 16px;box-shadow:0 18px 50px var(--shadow);text-align:center;}
  .upd-kick{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--stamp);margin-bottom:8px;}
  .upd-tit{font-family:'Newsreader',serif;font-weight:800;font-size:25px;line-height:1.1;letter-spacing:-.01em;margin-bottom:10px;}
  .upd-txt{font-size:13.5px;color:var(--muted);line-height:1.5;margin-bottom:14px;}
  .upd-ver{display:flex;justify-content:space-between;gap:10px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:8px 2px;margin-bottom:16px;}
  .upd-ver b{color:var(--ink);font-weight:600;}
  .upd-go{display:block;width:100%;border:0;border-radius:8px;background:var(--stamp);color:#fff;font:600 14px 'Inter',sans-serif;padding:12px;}
  .upd-later{display:block;width:100%;border:0;background:transparent;color:var(--muted);font:500 13px 'Inter',sans-serif;padding:10px 0 2px;}
  @keyframes updIn{from{opacity:0}to{opacity:1}}
  html[data-theme="night"] .upd-banner{background:#0E0E11;color:var(--ink);border:1px solid var(--rule);}

  /* =================== STILE MODERNO =================== */
  html[data-look="modern"]{
    --paper:#F6F5F1; --card:#FFFFFF; --ink:#17171A; --muted:#62626A;
    --faint:#9A9AA2; --rule:#E6E4DE; --rule2:#D6D3CB; --stamp:#B3301F; --snip:#4A4A52;
    --shadow:rgba(20,20,25,.12); --r:14px;
  }
  html[data-look="modern"][data-theme="night"]{
    --paper:#111214; --card:#1B1C20; --ink:#EDEDEF; --muted:#A0A0A8;
    --faint:#6E6E76; --rule:#2A2B30; --rule2:#3A3B42; --stamp:#F0745E; --snip:#BDBDC4;
    --shadow:rgba(0,0,0,.45);
  }

/* ---------- utils ---------- */
function stripHtml(h){const d=document.createElement("div");d.innerHTML=h||"";return (d.textContent||d.innerText||"").replace(/\s+/g," ").trim();}
function timeAgo(d){
  if(!d||isNaN(d)) return "";
  const s=(Date.now()-d.getTime())/1000;
  if(s<60) return "ora"; if(s<3600) return Math.floor(s/60)+" min fa";
  if(s<86400) return Math.floor(s/3600)+" h fa";
  const g=Math.floor(s/86400); if(g===1) return "ieri"; if(g<7) return g+" gg fa";
  return d.toLocaleDateString("it-IT",{day:"2-digit",month:"short"});
}
async function withTimeout(promise,ms,ctrl){
  let t; const timeout=new Promise((_,rej)=>{t=setTimeout(()=>{ctrl&&ctrl.abort();rej(new Error("timeout"));},ms);});
  try{ return await Promise.race([promise,timeout]); } finally { clearTimeout(t); }
}
/* prova i proxy partendo da quello che ha funzionato l'ultima volta */
function proxyName(i){ try{ return PROXIES[i]("X").split("/")[2]; }catch(e){ return "p"+i; } }
function proxyOrder(){
  const idx=PROXIES.map((_,i)=>i);
  let saved=null;
  try{ saved=localStorage.getItem(PROXY_PICK); }catch(e){}
  if(!saved) return idx;
  const k=idx.findIndex(i=>proxyName(i)===saved);
  if(k<0) return idx;
  return [...idx.slice(k),...idx.slice(0,k)];
}
async function proxyGet(url,ms=8000){
  let lastErr=null;
  for(const i of proxyOrder()){
    const ctrl=new AbortController();
    try{
      const r=await withTimeout(fetch(PROXIES[i](url),{signal:ctrl.signal}),ms,ctrl);
      if(!r.ok){ lastErr=new Error("HTTP "+r.status); continue; }
      let t=await r.text();
      if(!t||t.length<60){ lastErr=new Error("vuoto"); continue; }
      // pagina di blocco / captcha travestita da risposta valida
      if(/^\s*<!doctype html/i.test(t) && !/<rss|<feed|<channel/i.test(t)){
        lastErr=new Error("bloccato dalla testata"); continue;
      }
      // gli endpoint tipo /get impacchettano dentro JSON
      if(t.trim().startsWith("{") && t.includes('"contents"')){
        try{ const j=JSON.parse(t); if(j.contents) t=j.contents; else {lastErr=new Error("json vuoto"); continue;} }catch(e){ lastErr=e; continue; }
      }
      try{ localStorage.setItem(PROXY_PICK,proxyName(i)); }catch(e){}
      return t;
    }catch(e){ lastErr=e; }
  }
  throw lastErr||new Error("tutti i proxy ko");
}

/* ---- parsing dei feed ---- */
function pickImage(it, desc){
  const tag=n=>it.getElementsByTagName(n);
  for(const n of ["media:content","media:thumbnail","content","thumbnail"]){
    for(const el of tag(n)){
      const u=el.getAttribute&&el.getAttribute("url");
      const type=el.getAttribute&&(el.getAttribute("type")||el.getAttribute("medium"));
      if(u && (!type || /image/i.test(type))) return u;
    }
  }
  for(const el of tag("enclosure")){
    const u=el.getAttribute("url"), t=el.getAttribute("type")||"";
    if(u && (/image/i.test(t) || /\.(jpe?g|png|webp|avif)(\?|$)/i.test(u))) return u;
  }
  const m=(desc||"").match(/<img[^>]+src=["']([^"']+)["']/i);
  return m?m[1]:null;
}
function parseFeed(xml,topic){
  const doc=new DOMParser().parseFromString(xml,"text/xml");
  let items=[...doc.querySelectorAll("item")]; let atom=false;
  if(items.length===0){items=[...doc.querySelectorAll("entry")];atom=true;}
  const chan=doc.querySelector("channel > title")?.textContent||doc.querySelector("feed > title")?.textContent||"";
  return items.map(it=>{
    const title=stripHtml(it.querySelector("title")?.textContent||"");
    let link="";
    if(atom){const ls=[...it.querySelectorAll("link")];link=(ls.find(x=>x.getAttribute("rel")==="alternate")||ls[0])?.getAttribute("href")||"";}
    else{link=it.querySelector("link")?.textContent||"";}
    const rawDesc=it.querySelector("description")?.textContent||it.querySelector("summary")?.textContent||it.querySelector("content")?.textContent||"";
    const ds=it.querySelector("pubDate")?.textContent||it.querySelector("updated")?.textContent||it.querySelector("published")?.textContent||"";
    let src=chan; try{if(!src&&link)src=new URL(link.trim()).hostname.replace("www.","");}catch(e){}
    let img=null; try{ img=pickImage(it,rawDesc); }catch(e){}
    if(img && img.startsWith("http://")) img="https://"+img.slice(7);
    return {title,link:(link||"").trim(),snippet:stripHtml(rawDesc).slice(0,280),date:ds?new Date(ds):null,source:src,topic,img};
  }).filter(a=>{
    if(!a.title||!a.link) return false;
    // scarto le notizie vecchie: le ricerche di Google, se il tema è di nicchia,
    // riempiono con articoli di anni fa. Senza data la tengo (di solito è roba fresca).
    if(a.date && !isNaN(a.date)){
      const giorni=(Date.now()-a.date.getTime())/86400000;
      if(giorni>MAX_AGE_DAYS) return false;
      if(giorni< -1) return false;     // date nel futuro = feed sballato
    }
    return true;
  });
}
async function fetchArticleText(url){
  try{
    const html=await proxyGet(url,9000);
    const doc=new DOMParser().parseFromString(html,"text/html");
    doc.querySelectorAll("script,style,nav,header,footer,aside,form,figure").forEach(e=>e.remove());
    const ps=[...doc.querySelectorAll("article p, main p, p")].map(p=>p.textContent.trim()).filter(t=>t.length>45);
    return [...new Set(ps)].join("\n").slice(0,6500);
  }catch(e){return "";}
}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);return true;}
  catch(e){
    try{const ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";

  }
}

const COINS={btcusd:"bitcoin",ethusd:"ethereum",solusd:"solana",xrpusd:"ripple",adausd:"cardano"};
const FIAT=/^([a-z]{3})([a-z]{3})$/i;
/* alias comodi -> simboli Yahoo */
const YAHOO={
  "^spx":"^GSPC", "^gspc":"^GSPC", "^ndq":"^IXIC", "^ixic":"^IXIC", "^dji":"^DJI",
  "^dax":"^GDAXI", "^gdaxi":"^GDAXI", "^ftsemib":"FTSEMIB.MI", "ftsemib":"FTSEMIB.MI",

};
function toYahoo(sym){
  const k=sym.toLowerCase();
  if(YAHOO[k]) return YAHOO[k];
  const m=k.match(/^([a-z0-9.\-]+)\.(it|us|de|uk|fr)$/);
  if(m){ const suf={it:".MI",de:".DE",uk:".L",fr:".PA",us:""}[m[2]]; return m[1].toUpperCase()+suf; }
  return sym.toUpperCase();
}

async function fetchQuote(sym){
  const s0=sym.toLowerCase();

  // cripto: CoinGecko, diretto
  if(COINS[s0]){
    const r=await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${COINS[s0]}&vs_currencies=usd&include_24hr_change=true`);
    const j=await r.json(); const d=j[COINS[s0]];
    if(!d) throw new Error("no data");
    return {value:d.usd.toLocaleString("it-IT",{maximumFractionDigits:0}), pct:d.usd_24h_change};
  }

  // valute: Frankfurter (BCE), diretto
  const f=s0.match(FIAT);
  if(f && !s0.startsWith("^") && f[1]!==f[2] && !YAHOO[s0]){
    const b=f[1].toUpperCase(), q=f[2].toUpperCase();
    const r=await fetch(`https://api.frankfurter.dev/v1/latest?base=${b}&symbols=${q}`);
    const j=await r.json(); const last=j.rates?.[q];
    if(!last) throw new Error("no data");
    let pct=0;
    try{
      const d=new Date(); d.setDate(d.getDate()-7);
      const r2=await fetch(`https://api.frankfurter.dev/v1/${d.toISOString().slice(0,10)}..?base=${b}&symbols=${q}`);
      const j2=await r2.json();
      const days=Object.keys(j2.rates||{}).sort();
      const prev=j2.rates[days[days.length-2]]?.[q];
      if(prev) pct=((last-prev)/prev)*100;
    }catch(e){}
    return {value:last.toLocaleString("it-IT",{minimumFractionDigits:4,maximumFractionDigits:4}), pct};
  }

  // indici e azioni: Yahoo Finance via proxy (Stooq blocca i datacenter)
  const y=toYahoo(s0);
  try{
    const txt=await proxyGet(`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(y)}?range=5d&interval=1d`,9000);
    const j=JSON.parse(txt);
    const meta=j?.chart?.result?.[0]?.meta;
    if(!meta) throw new Error("no data");
    const last=meta.regularMarketPrice;
    const prev=meta.chartPreviousClose ?? meta.previousClose;
    if(!isFinite(last)) throw new Error("no price");
    const pct=isFinite(prev)&&prev?((last-prev)/prev)*100:0;
    const dec=Math.abs(last)<10?4:2;
    return {value:last.toLocaleString("it-IT",{minimumFractionDigits:dec,maximumFractionDigits:dec}), pct};
  }catch(e){
    // ripiego su Stooq
    const csv=await proxyGet(`https://stooq.com/q/d/l/?s=${encodeURIComponent(s0)}&i=d`,9000);
    const rows=csv.trim().split("\n").filter(r=>/^\d{4}-\d{2}-\d{2},/.test(r));
    if(rows.length<2) throw new Error("no data");
    const close=r=>parseFloat(r.split(",")[4]);
    const last=close(rows[rows.length-1]), prev=close(rows[rows.length-2]);
    if(!isFinite(last)||!isFinite(prev)) throw new Error("bad data");
    const dec=Math.abs(last)<10?4:2;
    return {value:last.toLocaleString("it-IT",{minimumFractionDigits:dec,maximumFractionDigits:dec}), pct:((last-prev)/prev)*100};
  }
}
const BING=q=>`https://www.bing.com/news/search?q=${encodeURIComponent(q)}&format=rss&setmkt=it-IT`;
async function fetchTopic(q){
  const sources=[["Google News",G(q)],["Bing News",BING(q)]];
  let lastErr=null;
  for(const [name,url] of sources){
    try{
      const xml=await proxyGet(url,8000);
      const items=parseFeed(xml,"topic").slice(0,6);
      if(!items.length){ lastErr=new Error(name+": nessun titolo"); continue; }
      return items.map(i=>({title:i.title.replace(/\s+-\s+[^-]+$/,"").trim(), link:i.link, date:i.date}));
    }catch(e){ lastErr=new Error(name+": "+(e.message||"ko")); }
  }
  throw lastErr||new Error("nessuna fonte");
}
const GEO_KEY="rassegna_geo";
function getPosition(){
  // posizione recente (<1 h) in memoria: niente richieste continue al GPS
  let last=null; try{ last=JSON.parse(localStorage.getItem(GEO_KEY)); }catch(e){}
  if(last && Date.now()-last.at<60*60*1000) return Promise.resolve(last);
  return new Promise((res,rej)=>{
    if(!navigator.geolocation){ last?res(last):rej(new Error("posizione non disponibile")); return; }
    navigator.geolocation.getCurrentPosition(
      p=>{ const o={lat:p.coords.latitude,lon:p.coords.longitude,at:Date.now(),name:null};
           if(last && Math.abs(last.lat-o.lat)<0.02 && Math.abs(last.lon-o.lon)<0.02) o.name=last.name;
           try{localStorage.setItem(GEO_KEY,JSON.stringify(o));}catch(e){} res(o); },
      e=>{ if(last) res(last); else rej(new Error(e.code===1?"posizione non consentita":"posizione non trovata")); },
      {enableHighAccuracy:false,timeout:10000,maximumAge:30*60*1000});
  });
}
async function placeName(pos){
  if(pos.name) return pos.name;
  try{
    const r=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${pos.lat}&longitude=${pos.lon}&localityLanguage=it`);
    const j=await r.json();
    const n=j.city||j.locality||j.principalSubdivision||"";
    if(n){ pos.name=n; try{localStorage.setItem(GEO_KEY,JSON.stringify(pos));}catch(e){} }
    return n;
  }catch(e){ return ""; }
}
async function fetchWeatherAt(lat,lon){
  const w=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1`);
  const wj=await w.json();
  const c=wj.current||{}, d=wj.daily||{};
  return {temp:Math.round(c.temperature_2m), code:c.weather_code, max:Math.round(d.temperature_2m_max?.[0]), min:Math.round(d.temperature_2m_min?.[0])};
}
async function fetchWeather(city){
  if(/^(auto|qui|posizione)$/i.test((city||"").trim())){
    const pos=await getPosition();
    const [v,name]=await Promise.all([fetchWeatherAt(pos.lat,pos.lon),placeName(pos)]);
    return {...v,name:name||"Qui",here:true};
  }
  const g=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=it`);
  const gj=await g.json();
  const loc=gj.results&&gj.results[0]; if(!loc) throw new Error("città?");
  const w=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.latitude}&longitude=${loc.longitude}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1`);
  const wj=await w.json();
  const c=wj.current||{}, d=wj.daily||{};
  return {temp:Math.round(c.temperature_2m), code:c.weather_code, max:Math.round(d.temperature_2m_max?.[0]), min:Math.round(d.temperature_2m_min?.[0]), name:loc.name};
}
const WMO=c=>{
  if(c===0) return "☀"; if(c<=2) return "⛅"; if(c===3) return "☁";
  if(c<=48) return "🌫"; if(c<=57) return "🌦"; if(c<=67) return "🌧";
  if(c<=77) return "🌨"; if(c<=82) return "🌧"; if(c<=86) return "🌨";
  return "⛈";
};
function parseWidgets(t){
  return t.split("\n").map(l=>l.trim()).filter(Boolean).filter(l=>!l.startsWith("#")).map(l=>{
    const m=l.match(/^(quote|topic|weather)\s+(.+)$/i);
    if(!m) return null;
    const type=m[1].toLowerCase();
    let rest=m[2].trim(), label=null;
    // etichetta esplicita dopo la barra verticale: "topic Serie A | Calcio"
    const bar=rest.split("|");
    if(bar.length>1){ label=bar.pop().trim(); rest=bar.join("|").trim(); }
    if(type==="quote"){
      // qui il primo token è il simbolo, il resto è l'etichetta
      const parts=rest.split(/\s+/);
      const arg=parts.shift();
      return {type,arg,label:label||(parts.join(" ")||arg)};
    }
    // topic e weather: l'argomento è tutta la frase ("Serie A", "Reggio Emilia")
    if(type==="weather"&&/^(auto|qui|posizione)$/i.test(rest)) return {type,arg:"auto",label:label||"Meteo qui"};
    return {type,arg:rest,label:label||rest};
  }).filter(Boolean);
}
function widgetsToText(ws){
  return ws.map(w=>{
    if(w.type==="quote") return `quote ${w.arg}${w.label&&w.label!==w.arg?" "+w.label:""}`;
    return `${w.type} ${w.arg}${w.label&&w.label!==w.arg?" | "+w.label:""}`;
  }).join("\n");
}

function ser(a){return {...a,date:a.date?a.date.toISOString():null};}
function deser(a){return {...a,date:a.date?new Date(a.date):null};}
function dayKey(d){ d=d||new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function slimArt(a){ return {t:a.title,l:a.link,s:(a.snippet||"").slice(0,200),src:a.source||"",tp:a.topic||"",d:a.date?(a.date instanceof Date?a.date.toISOString():a.date):null}; }
function fatArt(x){ return {title:x.t,link:x.l,snippet:x.s,source:x.src,topic:x.tp,date:x.d?new Date(x.d):null,img:null}; }
function readArchive(){ try{ return JSON.parse(localStorage.getItem(LS.archive))||{}; }catch(e){ return {}; } }
function writeArchive(obj){ try{ localStorage.setItem(LS.archive,JSON.stringify(obj)); }catch(e){} }
function pruneArchive(obj){
  const keep=[]; for(let i=0;i<ARCH_DAYS;i++){ const d=new Date(); d.setDate(d.getDate()-i); keep.push(dayKey(d)); }
  const out={}; keep.forEach(k=>{ if(obj[k]) out[k]=obj[k]; }); return out;
}
function stable(o){   // JSON con chiavi ordinate: confronti affidabili contro Firestore
  if(Array.isArray(o)) return "["+o.map(stable).join(",")+"]";
  if(o && typeof o==="object") return "{"+Object.keys(o).sort().map(k=>JSON.stringify(k)+":"+stable(o[k])).join(",")+"}";
  return JSON.stringify(o);
}
function normTxt(t){ return (t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""); }

function readCache(){

       return {at:c.at, articles:c.articles.map(deser)}; }catch(e){ return null; }
}
function writeCache(articles){

}

/* unione salvati per link, il più recente vince */
function mergeSaved(a,b){
  const m=new Map();
  [...(a||[]),...(b||[])].forEach(x=>{ const p=m.get(x.link); if(!p||(x.savedAt||0)>(p.savedAt||0)) m.set(x.link,x); });
  return [...m.values()].sort((x,y)=>(y.savedAt||0)-(x.savedAt||0));
}

function Ticker({widgets}){
  const [data,setData]=useState({});
  const [rot,setRot]=useState(0);

  useEffect(()=>{
    let dead=false;
    const key="rassegna_wcache";
    let cache={}; try{cache=JSON.parse(sessionStorage.getItem(key))||{};}catch(e){}

    // se ho già tutto in cache, mostro subito senza attese
    const ids=widgets.map(w=>w.type+":"+w.arg);
    const allCached=ids.every(id=>cache[id]&&Date.now()-cache[id].at<WIDGET_TTL);
    if(allCached){
      const d={}; ids.forEach(id=>d[id]=cache[id].v); setData(d); return;
    }

    (async()=>{
      // scarico tutte le schede in parallelo e aspetto che siano pronte:
      // un solo aggiornamento, così la fascia non cresce a scatti mentre leggi
      const out={};
      await Promise.all(widgets.map(async w=>{
        const id=w.type+":"+w.arg;
        if(cache[id] && Date.now()-cache[id].at<WIDGET_TTL){ out[id]=cache[id].v; return; }
        try{
          let v;
          if(w.type==="quote") v=await fetchQuote(w.arg);
          else if(w.type==="topic") v=await fetchTopic(w.arg);
          else v=await fetchWeather(w.arg);
          out[id]=v; cache[id]={at:Date.now(),v};
        }catch(e){ console.warn("[widget]",w.type,w.arg,e.message||e); out[id]={err:true,why:e.message||"errore"}; }
      }));
      if(dead) return;
      setData(out);
      try{sessionStorage.setItem(key,JSON.stringify(cache));}catch(e){}
    })();

    return ()=>{dead=true;};
  },[widgets]);

  // niente rotazione automatica: il titolo cambia solo se lo chiedi tu

  if(!widgets.length) return null;
  return (
    <div className="tickerwrap"><div className="ticker">
      {widgets.map((w,i)=>{
        const id=w.type+":"+w.arg, v=data[id];
        const wide=w.type==="topic";
        return (
          <div className={"tk"+(wide?" wide":"")} key={id+i}>
            <div className="lb">{v&&!v.err&&v.here?"📍 "+v.name:w.label}</div>
            {!v && <div className="sk"></div>}
            {v&&v.err && <div className="err" title={v.why} style={{cursor:"help"}}>n/d</div>}
            {v&&!v.err&&w.type==="quote" && (
              <div className="vl">{v.value}
                <span className={"dl "+(v.pct>=0?"up":"dn")}>{v.pct>=0?"▲":"▼"} {Math.abs(v.pct).toFixed(2)}%</span>
              </div>
            )}
            {v&&!v.err&&w.type==="weather" && (
              <div className="vl">{WMO(v.code)} {v.temp}°
                <span className="dl" style={{color:"var(--faint)"}}>{v.min}° / {v.max}°</span>
              </div>
            )}
            {v&&!v.err&&w.type==="topic" && v.length>0 && (
              <>
                <a className="hd" href={v[rot%v.length].link} target="_blank" rel="noopener">
                  {v[rot%v.length].title}
                </a>
                {v.length>1 && (
                  <button className="nxt" onClick={()=>setRot(r=>r+1)} title="Titolo successivo">
                    {(rot%v.length)+1}/{v.length} ›
                  </button>
                )}
              </>
            )}
          </div>
        );
      })}
    </div></div>
  );
}


/* ============================================================
   RISULTATI SPORT — API pubblica ESPN (gratuita, senza chiave)
   ============================================================ */
const SP_TAB="__risultati";
const SP_LEAGUES=[
  {id:"ita.1",label:"Serie A",sport:"soccer",table:true},
  {id:"uefa.champions",label:"Champions",sport:"soccer",table:false},
  {id:"ita.2",label:"Serie B",sport:"soccer",table:true},
  {id:"eng.1",label:"Premier",sport:"soccer",table:true},
  {id:"esp.1",label:"LaLiga",sport:"soccer",table:true},
  {id:"f1",label:"F1",sport:"racing"},
  {id:"nba",label:"NBA",sport:"basketball",table:false},
];
const SP_BASE="https://site.api.espn.com/apis/site/v2/sports/";
const spYmd=d=>d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
async function spJson(url,ttl){
  const k="sp:"+url;
  try{ const c=JSON.parse(sessionStorage.getItem(k)); if(c&&Date.now()-c.at<ttl) return c.v; }catch(e){}
  const r=await fetch(url); if(!r.ok) throw new Error("HTTP "+r.status);
  const v=await r.json();
  try{ sessionStorage.setItem(k,JSON.stringify({at:Date.now(),v})); }catch(e){}
  return v;
}
function spMatch(e){
  const c=e.competitions?.[0]||{}; const st=e.status?.type||{};
  const side=h=>{ const x=(c.competitors||[]).find(t=>t.homeAway===h)||{}; const t=x.team||{};
    return {name:t.shortDisplayName||t.displayName||"?", logo:t.logo||"", score:x.score, win:x.winner}; };
  return {id:e.id, date:new Date(e.date), state:st.state, done:st.completed, detail:st.shortDetail||st.detail||"",
    home:side("home"), away:side("away"), link:(e.links||[])[0]?.href||""};
}
async function spFetchDays(lg,live){
  const ttl=live?45000:120000;
  const days=[]; for(let i=-3;i<=3;i++){ const d=new Date(); d.setDate(d.getDate()+i); days.push(spYmd(d)); }
  const res=await Promise.all(days.map(d=>spJson(`${SP_BASE}${lg.sport}/${lg.id}/scoreboard?dates=${d}`,ttl).catch(()=>null)));
  const seen=new Set(), out=[];
  res.forEach(j=>(j?.events||[]).forEach(e=>{ if(!seen.has(e.id)){ seen.add(e.id); out.push(spMatch(e)); } }));
  if(res.every(r=>r===null)) throw new Error("risultati non raggiungibili");
  return out.sort((a,b)=>a.date-b.date);
}
async function spFetchTable(lg){
  const j=await spJson(`https://site.api.espn.com/apis/v2/sports/${lg.sport}/${lg.id}/standings`,10*60000);
  const groups=(j.children||[]).map(g=>({name:g.name, rows:(g.standings?.entries||[]).map(en=>{
    const st={}; (en.stats||[]).forEach(x=>{ st[x.name]=x.displayValue; });
    return {team:en.team?.shortDisplayName||en.team?.displayName||"?", logo:en.team?.logos?.[0]?.href||"", rank:+st.rank||0,
      pg:st.gamesPlayed, w:st.wins, d:st.ties, l:st.losses, gd:st.pointDifferential, pts:st.points};
  }).sort((a,b)=>a.rank-b.rank)}));
  return groups;
}
async function spFetchF1(){
  const j=await spJson(SP_BASE+"racing/f1/scoreboard",90000);
  const ev=(j.events||[])[0];
  const sess=(ev?.competitions||[]).map(c=>({type:c.type?.abbreviation||"", date:new Date(c.date), state:c.status?.type?.state, desc:c.status?.type?.description||"",
    top:(c.competitors||[]).slice().sort((a,b)=>(a.order||99)-(b.order||99)).map(x=>({pos:x.order, name:x.athlete?.displayName||x.athlete?.shortName||"?", flag:x.athlete?.flag?.alt||""}))}));
  let drivers=[], teams=[];
  try{
    const s=await spJson("https://site.api.espn.com/apis/v2/sports/racing/f1/standings",10*60000);
    const pick=(g,f)=>(g?.standings?.entries||[]).map(en=>{ const st={}; (en.stats||[]).forEach(x=>st[x.name]=x.displayValue);
      return {name:f(en), rank:+st.rank||0, pts:st.championshipPts||st.points||"0"}; }).sort((a,b)=>a.rank-b.rank);
    drivers=pick((s.children||[])[0],en=>en.athlete?.displayName||"?");
    teams=pick((s.children||[])[1],en=>en.team?.displayName||en.athlete?.displayName||"?");
  }catch(e){}
  return {name:ev?.name||"", sess, drivers, teams};
}
const SESS_IT={FP1:"Libere 1",FP2:"Libere 2",FP3:"Libere 3",Qual:"Qualifiche",Race:"Gara",SS:"Sprint Shootout",Sprint:"Sprint",SQ:"Qualifiche sprint"};
function spDayLabel(d){
  const a=new Date(); a.setHours(0,0,0,0); const b=new Date(d); b.setHours(0,0,0,0);
  const diff=Math.round((b-a)/864e5);
  if(diff===0) return "Oggi"; if(diff===-1) return "Ieri"; if(diff===1) return "Domani";
  const t=d.toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"}); return t.charAt(0).toUpperCase()+t.slice(1);
}
function SpLogo({src}){ const [ok,setOk]=useState(true); if(!src||!ok) return <span className="sp-nologo"></span>;
  return <img className="sp-logo" src={src.replace("/500/","/500/")} alt="" loading="lazy" onError={()=>setOk(false)}/>; }

            <div className="sp-sess">

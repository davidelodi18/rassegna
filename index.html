                <div key={i} className={"sp-srow "+(x.state||"")}>
                  <span className="n">{SESS_IT[x.type]||x.type}</span>
                  <span className="d">{x.date.toLocaleDateString("it-IT",{weekday:"short",day:"numeric"})} · {x.date.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"})}</span>
                  <span className="w">{x.state==="in"?<span className="sp-live"><i></i>in corso</span>:x.state==="post"&&x.top[0]?"1° "+x.top[0].name:""}</span>
                </div>
              ))}
            </div>
            {main && (
              <div className="sp-block">
                <div className="sp-dlabel">{SESS_IT[main.type]||main.type} — ordine d'arrivo</div>
                <ol className="sp-order">{main.top.slice(0,10).map(x=><li key={x.pos+x.name}><span className="p">{x.pos}</span>{x.name}</li>)}</ol>
              </div>
            )}
            {f.drivers.length>0 && (
              <div className="sp-two">
                <div className="sp-block"><div className="sp-dlabel">Mondiale piloti</div>
                  <ol className="sp-order">{f.drivers.slice(0,10).map(x=><li key={x.name}><span className="p">{x.rank}</span>{x.name}<span className="pt">{x.pts}</span></li>)}</ol></div>
                {f.teams.length>0 && <div className="sp-block"><div className="sp-dlabel">Costruttori</div>
                  <ol className="sp-order">{f.teams.slice(0,10).map(x=><li key={x.name}><span className="p">{x.rank}</span>{x.name}<span className="pt">{x.pts}</span></li>)}</ol></div>}
              </div>
            )}
          </div>
        ); })()}
      <div className="sp-src">Dati ESPN · aggiornamento automatico ogni minuto durante le partite in corso</div>
    </div>
  );
}

function App(){
  useEffect(()=>{ console.log("%c[Rassegna] "+BUILD,"color:#8A281C;font-weight:bold","· proxy:",MY_PROXY||"solo pubblici"); },[]);
  const [feeds,setFeeds]=useState(()=>{try{return JSON.parse(localStorage.getItem(LS.feeds))||DEFAULT_FEEDS}catch{return DEFAULT_FEEDS}});
  const [read,setRead]=useState(()=>{try{return new Set(JSON.parse(localStorage.getItem(LS.read))||[])}catch{return new Set()}});
  const [saved,setSaved]=useState(()=>{try{return JSON.parse(localStorage.getItem(LS.saved))||[]}catch{return []}});
  const [archive,setArchive]=useState(()=>pruneArchive(readArchive()));
  const [query,setQuery]=useState("");
  const archiveRef=useRef(archive); useEffect(()=>{archiveRef.current=archive;},[archive]);
  const lastArch=useRef("");
  const [widgets,setWidgets]=useState(()=>{try{return migrateWidgets(JSON.parse(localStorage.getItem(LS.widgets)))||DEFAULT_WIDGETS}catch{return DEFAULT_WIDGETS}});
  useEffect(()=>{ try{ localStorage.setItem(LS.widgets,JSON.stringify(widgets)); }catch(e){} },[]); // eslint-disable-line
  const [look,setLookRaw]=useState(()=>{try{return localStorage.getItem("rassegna_look")||"classic"}catch(e){return "classic"}});
  const lookAt=useRef((()=>{try{return +localStorage.getItem("rassegna_look_at")||0}catch(e){return 0}})());
  const setLook=v=>{ lookAt.current=Date.now(); try{localStorage.setItem("rassegna_look_at",String(lookAt.current));}catch(e){} setLookRaw(v); };
  useEffect(()=>{document.documentElement.setAttribute("data-look",look);try{localStorage.setItem("rassegna_look",look);}catch(e){}},[look]);
  const [theme,setTheme]=useState(()=>localStorage.getItem(LS.theme)|| (window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"night":"day"));

  const cached=useRef(readCache());
  const [articles,setArticles]=useState(()=>cached.current?cached.current.articles:[]);
  const articlesRef=useRef([]);
  useEffect(()=>{articlesRef.current=articles;},[articles]);
  const [fresh,setFresh]=useState(0);
  const [loading,setLoading]=useState(false);
  const [failed,setFailed]=useState([]);
  const [updated,setUpdated]=useState(()=>cached.current?new Date(cached.current.at):null);
  const [tab,setTab]=useState("all");
  const [sel,setSel]=useState(new Set());
  const [panel,setPanel]=useState(null);
  const [settings,setSettings]=useState(false);
  const [menu,setMenu]=useState(false);
  const [toast,setToast]=useState("");
  const [busy,setBusy]=useState(null);
  const [showFails,setShowFails]=useState(false);

  const [user,setUser]=useState(null);
  const [syncing,setSyncing]=useState(false);
  const remote=useRef(false);   // true mentre applico dati dal cloud
  const now=new Date();
  const order=Object.keys(feeds);
  const flash=m=>{setToast(m);setTimeout(()=>setToast(""),2600);};
  const nuovaVersione=useNuovaVersione();
  const [updChiuso,setUpdChiuso]=useState(false);   // pop-up chiuso con "Più tardi"
  const [updNascosto,setUpdNascosto]=useState(false); // anche la striscia in basso chiusa
  const controllaAggiornamenti=async()=>{
    try{
      const b=await appBuildOnline();
      if(b&&b!==APP_BUILD){ flash("Aggiornamento alla versione "+b+"…"); setTimeout(appRicarica,700); }
      else flash("App già aggiornata (versione "+(APP_BUILD||"—")+")");
    }catch(e){ flash("Controllo non riuscito: verifica la connessione"); }
  };

  useEffect(()=>{document.documentElement.setAttribute("data-theme",theme);localStorage.setItem(LS.theme,theme);},[theme]);

  /* ---------- Firebase ---------- */
  useEffect(()=>{
    if(!FB) return;
    return FB.auth.onAuthStateChanged(u=>setUser(u||null));
  },[]);

  // listener sul documento dell'utente
  useEffect(()=>{
    if(!FB||!user) return;
    setSyncing(true);
    const ref=FB.db.collection("rassegna").doc(user.uid);
    const unsub=ref.onSnapshot(snap=>{
      setSyncing(false);
      if(!snap.exists){ pushCloud(true); return; }
      const d=snap.data()||{};
      remote.current=true;

      const ms=mergeSaved(saved,d.saved);
      if(stable(ms)!==stable(saved)){ setSaved(ms); localStorage.setItem(LS.saved,JSON.stringify(ms)); }

      const mr=new Set([...(d.read||[]),...read]);
      if(mr.size!==read.size){ setRead(mr); localStorage.setItem(LS.read,JSON.stringify([...mr].slice(-MAX_READ))); }

      if(d.feeds&&Object.keys(d.feeds).length&&stable(d.feeds)!==stable(feeds)){
        quietFeeds.current=true;   // viene dal cloud: non far partire il download
        setFeeds(d.feeds); localStorage.setItem(LS.feeds,JSON.stringify(d.feeds));
      }
      const dw=migrateWidgets(d.widgets);
      if(Array.isArray(dw)&&dw.length&&stable(dw)!==stable(widgets)){
        setWidgets(dw); localStorage.setItem(LS.widgets,JSON.stringify(dw));
      }
      if(Array.isArray(d.widgets)&&stable(dw)!==stable(d.widgets)) setTimeout(()=>pushCloudRef.current&&pushCloudRef.current(true),1500);
      if(d.theme&&d.theme!==theme) setTheme(d.theme);
      if(d.look&&(d.lookAt||0)>lookAt.current){
        lookAt.current=d.lookAt; try{localStorage.setItem("rassegna_look_at",String(d.lookAt));}catch(e){}
        if(d.look!==look) setLookRaw(d.look);
      }

      setTimeout(()=>{remote.current=false;},0);
    },err=>{ setSyncing(false); console.error("[firestore]",err.code,err.message,err);
      flash(err.code==="permission-denied"?"Regole Firestore da pubblicare":"Sync non riuscita: "+(err.code||"")); });
    return unsub;
  },[user]); // eslint-disable-line

  const lastPush=useRef("");
  const pushCloud=useCallback(async(force)=>{
    if(!FB||!FB.auth.currentUser) return;
    if(remote.current&&!force) return;
    const payload={ saved, read:[...read].slice(-MAX_READ), feeds, widgets, theme, ...(lookAt.current?{look,lookAt:lookAt.current}:{}) };
    const sig=stable(payload);
    if(sig===lastPush.current && !force) return;   // niente di nuovo: non scrivo, non innesco lo snapshot
    lastPush.current=sig;
    try{
      await FB.db.collection("rassegna").doc(FB.auth.currentUser.uid).set({...payload, updatedAt:Date.now()},{merge:true});
    }catch(e){ console.error(e); }
  },[saved,read,feeds,widgets,theme,look]);
  const pushCloudRef=useRef(null); useEffect(()=>{pushCloudRef.current=pushCloud;},[pushCloud]);

  // scrittura debounced a ogni cambiamento locale
  useEffect(()=>{
    if(!FB||!user||remote.current) return;
    const t=setTimeout(()=>pushCloud(false),700);
    return ()=>clearTimeout(t);
  },[saved,read,feeds,widgets,theme,look,user]); // eslint-disable-line

  const AUTH_ERR={
    "auth/unauthorized-domain":"Dominio non autorizzato: aggiungilo in Authentication → Settings",
    "auth/operation-not-allowed":"Google non abilitato in Sign-in method",
    "auth/popup-closed-by-user":"Hai chiuso la finestra di Google",
    "auth/cancelled-popup-request":"Richiesta annullata, riprova",
    "auth/network-request-failed":"Rete non raggiungibile",
    "auth/invalid-api-key":"apiKey errata nel file",
    "auth/configuration-not-found":"Authentication non inizializzato nella console",
    "auth/web-storage-unsupported":"Disattiva la navigazione privata per il login",
    "auth/operation-not-supported-in-this-environment":"Apri il sito in Safari o Chrome, non dentro un'altra app",
  };

  // Il redirect si rompe quando authDomain sta su un dominio diverso (storage partitioning
  // di Safari/Chrome). Quindi: popup ovunque, redirect solo come ultima spiaggia.
  useEffect(()=>{
    if(!FB) return;
    FB.auth.getRedirectResult()
      .then(res=>{ if(res&&res.user) flash("Collegato — i salvati ti seguono"); })
      .catch(e=>{ console.error("[auth-redirect]",e.code,e.message); });
  },[]); // eslint-disable-line

  const pushArchive=useCallback(async(k,items)=>{
    if(!FB||!FB.auth.currentUser) return;
    const sig=k+":"+items.length; if(sig===lastArch.current) return; lastArch.current=sig;
    try{ await FB.db.collection("rassegna").doc(FB.auth.currentUser.uid)
      .collection("archive").doc(k).set({day:k,items,updatedAt:Date.now()}); }catch(e){ console.warn("pushArchive",e.message); }
  },[]);
  // al login tiro giù l'archivio degli ultimi giorni una volta sola (nessun listener)
  useEffect(()=>{
    if(!FB||!user) return;
    (async()=>{
      try{
        const keys=[]; for(let i=0;i<ARCH_DAYS;i++){ const d=new Date(); d.setDate(d.getDate()-i); keys.push(dayKey(d)); }
        const merged={...archiveRef.current};
        for(const k of keys){
          const snap=await FB.db.collection("rassegna").doc(user.uid).collection("archive").doc(k).get();
          if(snap.exists){
            const remote=snap.data().items||[];
            const local=merged[k]||[];
            const seen=new Set(local.map(x=>x.l));
            merged[k]=[...local,...remote.filter(x=>!seen.has(x.l))].slice(0,ARCH_MAX_DAY);
          }
        }
        const pruned=pruneArchive(merged);
        setArchive(pruned); writeArchive(pruned);
      }catch(e){ console.warn("pull archivio",e.message); }
    })();
  },[user]); // eslint-disable-line

  const signIn=async()=>{
    if(!FB){ flash("Firebase non configurato"); return; }
    const provider=new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({prompt:"select_account"});
    try{
      await FB.auth.signInWithPopup(provider);
      flash("Collegato — i salvati ti seguono");
    }catch(e){
      console.error("[auth]",e.code,e.message,e);
      if(e.code==="auth/popup-closed-by-user"||e.code==="auth/cancelled-popup-request"){
        flash("Login annullato"); return;
      }
      if(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment"){
        flash("Popup bloccato, provo col redirect…");
        try{ await FB.auth.signInWithRedirect(provider); return; }catch(e2){ console.error(e2); }
      }
      flash(AUTH_ERR[e.code] || ("Errore: "+(e.code||e.message)));
    }
  };
  const signOut=async()=>{ await FB.auth.signOut(); flash("Scollegato — resti in locale"); };

  /* ---------- feeds ---------- */
  const RESUME_KEY="rassegna_resume";
  const bg=useRef({hiddenAt:0});          // ultimo momento in cui l'app è andata in secondo piano
  const partial=useRef(null);             // download in corso: {all, prev}
  const load=useCallback(async(force,reason)=>{
    // Lucchetto: mai due caricamenti insieme, mai due a meno di 5s l'uno dall'altro.
    if(inFlight.current){ console.warn("[Rassegna] load ignorato (già in corso) —",reason); return; }
    if(reason!=="click-aggiorna" && Date.now()-lastLoadAt.current < 5000){
      console.warn("[Rassegna] load ignorato (troppo ravvicinato) —",reason); return;
    }
    inFlight.current=true; lastLoadAt.current=Date.now();
    console.log("%c[Rassegna] load() — motivo:","color:#8A281C;font-weight:bold", reason||"?");
    try{
    const c=readCache();
    if(!force && c && c.articles.length){   // senza "force" resto sulla cache, non scarico
      setArticles(c.articles); setUpdated(new Date(c.at)); inFlight.current=false; return;
    }
    const t0=performance.now(); const t0Wall=Date.now();
    setLoading(true); setFailed([]); setFresh(0);
    const jobs=[]; Object.entries(feeds).forEach(([tid,g])=>g.urls.forEach(u=>jobs.push({tid,u})));
    const fails=[],all=[];
    try{ localStorage.setItem(RESUME_KEY,String(Date.now())); }catch(e){}

    // le notizie già a schermo restano finché il nuovo carico non è completo
    const prev=articlesRef.current;
    const prevLinks=new Set(prev.map(a=>a.link));
    partial.current={all,prev};
    const ed=await fetchEdition();
    let fromSrv=0;

    const dedupeSort=list=>{
      const sorted=[...list].sort((a,b)=>(b.date?.getTime()||0)-(a.date?.getTime()||0));
      const seen=new Set(),dd=[];
      for(const a of sorted){ if(seen.has(a.link))continue; seen.add(a.link); dd.push(a); }
      return dd;
    };

    // Nessun disegno progressivo: la pagina resta ferma su ciò che stai leggendo
    // finché il download non è COMPLETO, poi si aggiorna una sola volta.
    const schedule=()=>{};   // no-op: non ridisegno durante il caricamento
    let cursor=0;
    const worker=async()=>{
      while(cursor<jobs.length){
        const j=jobs[cursor++];
        const f=ed&&!j.ripreso&&ed.get(j.u);
        if(f && Date.now()-(f.at||0)<SRV_MAX_AGE){
          try{ const items=parseFeed(f.xml,j.tid); if(items.length){ all.push(...items); fromSrv++; continue; } }catch(e){}
        }
        const tStart=Date.now();
        let done=false, lastWhy=null;
        for(let attempt=0;attempt<2&&!done;attempt++){
          try{
            const items=parseFeed(await proxyGet(j.u, attempt===0?4500:8000), j.tid);
            if(!items.length) throw new Error("nessun articolo");
            all.push(...items); done=true; schedule();
          }
          catch(e){ lastWhy=e.message||"errore"; if(attempt===0) await new Promise(r=>setTimeout(r,250)); }
        }
        if(!done){
          // fallito perché l'app era in secondo piano (iOS sospende la rete): lo rimetto in coda
          const interrotto=document.hidden || bg.current.hiddenAt>=tStart;
          if(interrotto && !j.ripreso){
            if(document.hidden) await new Promise(r=>{ const f=()=>{ if(!document.hidden){ document.removeEventListener("visibilitychange",f); r(); } }; document.addEventListener("visibilitychange",f); });
            jobs.push({...j,ripreso:true});
          } else fails.push({url:j.u, topic:j.tid, why:lastWhy||"errore"});
        }
      }
    };
    await Promise.all(Array.from({length:8},()=>worker()));

    const dd=dedupeSort(all);
    if(dd.length){
      // carico riuscito: tengo il nuovo elenco, ma non butto via i pezzi che stavi leggendo
      const merged=dedupeSort([...dd, ...prev.filter(a=>Date.now()-(a.date?.getTime()||0) < 36*3600*1000)]);
      setArticles(merged);
      writeCache(merged);
      setFresh(dd.filter(a=>!prevLinks.has(a.link)).length);
      console.log("%c[Rassegna] "+dd.length+" notizie in "+Math.round(performance.now()-t0)+"ms · "+fromSrv+"/"+jobs.length+" fonti dal server · "+fails.length+" feed ko","color:#8A281C;font-weight:bold");
    } else {
      // tutto fallito: resto su quello che c'era, senza schermata vuota
      setArticles(prev);
    }
    setFailed(fails); setUpdated(new Date()); setLoading(false);
    try{ localStorage.removeItem(RESUME_KEY); }catch(e){}
    syncServerFeeds(feeds);   // il server impara (o aggiorna) l'elenco delle tue fonti
    if(bg.current.hiddenAt>t0Wall){ const n=dd.filter(a=>!prevLinks.has(a.link)).length; flash("Aggiornamento completato"+(n?" · "+n+" nuove":"")); }
    } finally { inFlight.current=false; partial.current=null; }
  },[feeds]);
  useEffect(()=>{
    const onVis=()=>{
      if(document.hidden){
        bg.current.hiddenAt=Date.now();
        // se l'app viene chiusa da iOS, quello già scaricato resta
        const pc=partial.current;
        if(pc && pc.all.length){
          const sorted=[...pc.all,...pc.prev].sort((a,b)=>(b.date?.getTime()||0)-(a.date?.getTime()||0));
          const seen=new Set(),dd=[]; for(const a of sorted){ if(seen.has(a.link))continue; seen.add(a.link); dd.push(a); }
          writeCache(dd);
        }
      } else {
        // tornato sull'app: se un aggiornamento era rimasto a metà (app chiusa da iOS), lo riprendo
        let r=0; try{ r=+localStorage.getItem(RESUME_KEY)||0; }catch(e){}
        if(r && !inFlight.current && Date.now()-r<60*60*1000) load(true,"ripresa");
      }
    };
    const onHide=()=>{ if(partial.current){ bg.current.hiddenAt=Date.now(); const pc=partial.current; if(pc.all.length){
      const sorted=[...pc.all,...pc.prev].sort((x,y)=>(y.date?.getTime()||0)-(x.date?.getTime()||0));
      const seen=new Set(),dd=[]; for(const a of sorted){ if(seen.has(a.link))continue; seen.add(a.link); dd.push(a); } writeCache(dd); } } };
    document.addEventListener("visibilitychange",onVis);
    window.addEventListener("pagehide",onHide);
    return ()=>{ document.removeEventListener("visibilitychange",onVis); window.removeEventListener("pagehide",onHide); };
  },[load]);
  const feedsKey=useMemo(()=>stable(feeds),[feeds]);
  const first=useRef(true);
  const quietFeeds=useRef(false);   // true = le fonti sono cambiate dal cloud: adotta senza scaricare
  const inFlight=useRef(false);     // un caricamento alla volta
  const lastLoadAt=useRef(0);       // niente caricamenti a raffica
  useEffect(()=>{
    if(first.current){
      // Avvio: SOLO cache, mai un download automatico. Se è vuota, mostro l'invito ad Aggiorna.
      first.current=false;
      const c=readCache();
      if(c && c.articles && c.articles.length){ setArticles(c.articles); setUpdated(new Date(c.at)); }
      let r=0; try{ r=+localStorage.getItem(RESUME_KEY)||0; }catch(e){}
      if(r && Date.now()-r<60*60*1000){ console.log("[Rassegna] riprendo l'aggiornamento interrotto"); setTimeout(()=>load(true,"ripresa"),400); }
      else if(r){ try{ localStorage.removeItem(RESUME_KEY); }catch(e){} }
    }else if(quietFeeds.current){
      // Le fonti sono arrivate da Firestore: le adotto in silenzio, senza scaricare.
      quietFeeds.current=false;
      console.log("[Rassegna] fonti aggiornate dal cloud — nessun download automatico");
    }else{
      // Fonti cambiate da TE in ⚙: qui sì, ricarico.
      load(true,"cambio-fonti");
    }
  },[feedsKey]); // eslint-disable-line
  useEffect(()=>{window.scrollTo({top:0});},[tab]);

  const counts=useMemo(()=>{const c={all:articles.length};order.forEach(t=>c[t]=articles.filter(a=>a.topic===t).length);return c;},[articles,feeds]);

  const markRead=l=>setRead(p=>{const n=new Set(p);n.add(l);localStorage.setItem(LS.read,JSON.stringify([...n].slice(-MAX_READ)));return n;});
  const toggleSel=l=>setSel(p=>{const n=new Set(p);n.has(l)?n.delete(l):n.add(l);return n;});
  const isSaved=l=>saved.some(x=>x.link===l);
  const persistSaved=arr=>{setSaved(arr);localStorage.setItem(LS.saved,JSON.stringify(arr));};
  const toggleSave=a=>{
    if(isSaved(a.link)){ persistSaved(saved.filter(x=>x.link!==a.link)); flash("Rimosso da Leggi dopo"); }
    else{ const {title,link,snippet,source,topic,img}=a;
      persistSaved([{title,link,snippet:snippet||"",source:source||"",topic:topic||"",img:img||null,savedAt:Date.now(),date:a.date?new Date(a.date).toISOString():null},...saved]);
      flash("Salvato in Leggi dopo"); }
  };
  const clearSaved=()=>{ if(confirm("Svuotare la lista Leggi dopo?")) persistSaved([]); };
  const openArticle=a=>{markRead(a.link);window.open(a.link,"_blank","noopener");};

  const copySingle=async a=>{
    markRead(a.link);setBusy(a.link);
    const body=await fetchArticleText(a.link);setBusy(null);
    const text=singlePrompt(a,body);const ok=await copyText(text);
    setPanel({title:a.title,text});flash(ok?"Copiato — incolla in Claude":"Copia manuale dal riquadro");
  };
  const copyDigest=async()=>{
    const pool=[...articles]; saved.forEach(s0=>{if(!pool.some(x=>x.link===s0.link))pool.push({...s0,date:s0.date?new Date(s0.date):null});});
    const arts=pool.filter(a=>sel.has(a.link)); if(!arts.length) return;
    arts.forEach(a=>markRead(a.link));
    const text=digestPrompt(arts); const ok=await copyText(text);
    setPanel({title:`Digest — ${arts.length} articoli`,text}); setSel(new Set());
    flash(ok?"Digest copiato — incolla in Claude":"Copia manuale dal riquadro");
  };
  const recopy=async()=>{if(panel){const ok=await copyText(panel.text);flash(ok?"Ricopiato":"Copia manuale");}};

  /* ---------- pezzi UI ---------- */
  const Figure=({a,cls=""})=>{
    const [ok,setOk]=useState(true);
    if(!a.img||!ok) return null;
    return (
      <a className={"figure "+cls} href={a.link} target="_blank" rel="noopener" onClick={()=>markRead(a.link)}>
        <img src={a.img} alt="" loading="lazy" referrerPolicy="no-referrer" onError={()=>setOk(false)}/>
      </a>
    );
  };
  const Meta=({a})=>(
    <div className="meta">
      <span style={{color:"var(--stamp)"}}>{a.source||feeds[a.topic]?.label}</span>
      {a.date&&<span className="dot">·</span>}{a.date&&<span>{timeAgo(a.date)}</span>}
      {read.has(a.link)&&<span className="letto">letto</span>}
    </div>
  );
  const Acts=({a,full=true})=>(
    <div className="acts">
      <button className="primary" disabled={busy===a.link} onClick={()=>copySingle(a)}>{busy===a.link?"…":"Sintesi"}</button>
      {full&&<span className="sep">·</span>}
      {full&&<button onClick={()=>openArticle(a)}>Apri ↗</button>}
      {full&&<span className="sep">·</span>}
      {full&&<button className={sel.has(a.link)?"on":""} onClick={()=>toggleSel(a.link)}>{sel.has(a.link)?"✓ digest":"+ digest"}</button>}
      <span className="sep">·</span>
      <button className={isSaved(a.link)?"on":""} onClick={()=>toggleSave(a)}>{isSaved(a.link)?"★ salvato":"☆ dopo"}</button>
    </div>
  );
  const Lead=({a})=>(
    <div className={"lead"+(read.has(a.link)?" read":"")}>
      <Figure a={a}/>
      <div className="kick">{feeds[a.topic]?.label||"Notizia"}</div>
      <h1 className="hl"><a href={a.link} target="_blank" rel="noopener" onClick={()=>markRead(a.link)}>{a.title}</a></h1>
      {a.snippet&&<p className="snip clamp4">{a.snippet}</p>}
      <Meta a={a}/><Acts a={a}/>
    </div>
  );
  const Brief=({a})=>(
    <div className={"brief"+(read.has(a.link)?" read":"")}>
      <h3 className="hl"><a href={a.link} target="_blank" rel="noopener" onClick={()=>markRead(a.link)}>{a.title}</a></h3>
      <Meta a={a}/><Acts a={a} full={false}/>
    </div>
  );
  const Col=({a})=>(
    <div className={"colitem"+(read.has(a.link)?" read":"")+(a.img?"":" nopic")}>
      <div className="txt">
        <div className="kick">{feeds[a.topic]?.label}</div>
        <h2 className="hl"><a href={a.link} target="_blank" rel="noopener" onClick={()=>markRead(a.link)}>{a.title}</a></h2>
        {a.snippet&&<p className="snip clamp2">{a.snippet}</p>}
        <Meta a={a}/><Acts a={a}/>
      </div>
      <Figure a={a}/>
    </div>
  );

  const front=useMemo(()=>{
    if(!articles.length) return null;
    const lead=articles[0], aside=articles.slice(1,8);
    const used=new Set([lead.link,...aside.map(a=>a.link)]);
    const sections=order.map(t=>({t,label:feeds[t]?.label,items:articles.filter(a=>a.topic===t&&!used.has(a.link)).slice(0,6)})).filter(s=>s.items.length);
    return {lead,aside,sections};
  },[articles,feeds]);
  const sectionArts=useMemo(()=>(tab==="all"||tab==="saved"||tab==="search"||tab===SP_TAB)?[]:articles.filter(a=>a.topic===tab),[articles,tab]);
  const archiveCount=useMemo(()=>Object.values(archive).reduce((n,a)=>n+a.length,0),[archive]);
  const results=useMemo(()=>{
    const q=normTxt(query).trim(); if(q.length<2) return [];
    const words=q.split(/\s+/);
    const pool=new Map();
    articles.forEach(a=>pool.set(a.link,a));
    Object.values(archive).forEach(list=>list.forEach(x=>{ if(!pool.has(x.l)) pool.set(x.l,fatArt(x)); }));
    const hits=[];
    for(const a of pool.values()){
      const hay=normTxt(a.title+" "+(a.snippet||"")+" "+(a.source||""));
      if(words.every(w=>hay.includes(w))) hits.push(a);
    }
    hits.sort((a,b)=>(b.date?.getTime()||0)-(a.date?.getTime()||0));
    return hits.slice(0,120);
  },[query,archive,articles]);

  return (
    <div className="wrap">
      <div style={{position:"fixed",top:2,right:6,zIndex:99,fontFamily:"'IBM Plex Mono',monospace",fontSize:9,color:"var(--faint)",opacity:.6}}>{BUILD}</div>
      <div className="plate">
        <div className="top">
          <span>Edizione del {now.toLocaleDateString("it-IT",{day:"2-digit",month:"long",year:"numeric"})}</span>
          <span>{now.toLocaleDateString("it-IT",{weekday:"long"})}</span>
        </div>
        <div className="name">Rassegna</div>
        <div className="motto">{theme==="day"?"l'edizione del giorno, in due minuti":"edizione della sera"}</div>
      </div>

      <Ticker widgets={widgets}/>

      <div className="secbar">
        <button className="secmenu" onClick={()=>setMenu(true)} aria-label="Menu">☰</button>
        <button className={tab==="all"?"active":""} onClick={()=>setTab("all")}>Prima pagina</button>
        <button className={tab===SP_TAB?"active":""} onClick={()=>setTab(SP_TAB)}>⚽ Risultati</button>
        <button className={tab==="saved"?"active":""} onClick={()=>setTab("saved")}>★ Da leggere{saved.length>0&&<span className="n">{saved.length}</span>}</button>
        <button className={tab==="search"?"active":""} onClick={()=>setTab("search")}>⌕ Cerca</button>
        {order.map(t=>(
          <button key={t} className={tab===t?"active":""} onClick={()=>setTab(t)}>{feeds[t].label}<span className="n">{counts[t]||0}</span></button>
        ))}
      </div>

      <div className="utility">
        <span className="chips">
          {loading && <span className="chip-s live">aggiorno…</span>}
          {!loading && updated && (()=>{ const stale=(Date.now()-updated.getTime())>30*60*1000;
            return <span className={"chip-s"+(stale?" bad":"")} title={stale?"Notizie non recenti — premi Aggiorna":""}>
              {stale?"↻ ":""}{updated.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"})}</span>; })()}
          <span className="chip-s">{articles.length} notizie</span>
          {fresh>0 && !loading && <span className="chip-s new">{fresh} nuove</span>}
          {failed.length>0 && (
            <button className="chip-s bad" onClick={()=>setShowFails(v=>!v)}>{failed.length} feed ko</button>
          )}
          {user && <span className="chip-s ok">sync</span>}
          {FB && !user && <span className="chip-s">offline</span>}
        </span>
        <span className="r">
          <button className={"ib"+(loading?" spin":"")} onClick={()=>load(true,"click-aggiorna")}>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>{loading?"…":"Aggiorna"}
          </button>
          <span className="menuwrap">
            <button className={"ib menubtn"+(menu?" open":"")} onClick={()=>setMenu(v=>!v)} aria-expanded={menu}>
              <span className="burger">☰</span>Menu
            </button>
          </span>
        </span>
      </div>

      {showFails && failed.length>0 && (
        <div style={{border:"1px solid var(--rule)",borderRadius:8,padding:"12px 14px",margin:"10px 0",background:"var(--card)"}}>
          <div style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:10,letterSpacing:".12em",textTransform:"uppercase",color:"var(--stamp)",marginBottom:8}}>Feed che non rispondono</div>
          {failed.map((f,i)=>(
            <div key={i} style={{fontSize:12,color:"var(--muted)",marginBottom:5,wordBreak:"break-all",lineHeight:1.4}}>
              <span style={{color:"var(--ink)"}}>{feeds[f.topic]?.label||f.topic}</span> — {f.url}
              <span style={{color:"var(--stamp)"}}> ({f.why})</span>
            </div>
          ))}
          <div style={{fontSize:12,color:"var(--faint)",marginTop:8}}>Copiali e toglili da ⚙ → Fonti, oppure lasciali: l'app li salta e usa gli altri.</div>
        </div>
      )}

      {tab==="all" && (
        <>
          {!loading && !front && <div className="empty"><b>Premi Aggiorna</b>Le notizie si scaricano solo quando premi la freccia ↻ in alto.</div>}
          {front && (
            <>
              <div className="top">
                <Lead a={front.lead}/>
                <div className="aside">
                  <div className="h">Ultime</div>
                  {front.aside.map(a=><Brief key={a.link} a={a}/>)}
                </div>
              </div>
              {front.sections.map(s=>(
                <div className="section" key={s.t}>
                  <div className="sechead">
                    <button onClick={()=>setTab(s.t)}>{s.label}</button>
                    <span className="line"></span>
                    <span className="more" onClick={()=>setTab(s.t)}>tutte →</span>
                  </div>
                  <div className={"cols "+(s.items.length>=3?"c3":"c2")}>
                    {s.items.map(a=><Col key={a.link} a={a}/>)}
                  </div>
                </div>
              ))}
            </>
          )}
        </>
      )}

      {tab==="saved" && (
        <div className="secview">
          {saved.length===0 && <div className="empty"><b>Niente da leggere dopo</b>Metti da parte un articolo con <span className="mono" style={{color:"var(--stamp)"}}>☆ dopo</span>: lo ritrovi qui, anche domani.</div>}
          {saved.length>0 && (
            <>
              <div className="savedbar">
                <span>{saved.length} articoli messi da parte{user?" · sincronizzati":" · solo su questo browser"}</span>
                <span className="r">
                  <button className="ib" onClick={()=>{setSel(new Set(saved.map(a=>a.link)));flash("Tutti selezionati per il digest");}}>Seleziona tutti</button>
                  <button className="ib" onClick={clearSaved}>Svuota</button>
                </span>
              </div>
              <div className="section" style={{borderTop:"2px solid var(--ink)",paddingTop:20}}>
                <div className="cols c2">
                  {saved.map(a=>{
                    const art={...a,date:a.date?new Date(a.date):null};
                    return (
                      <div className={"colitem saveditem"+(read.has(a.link)?" read":"")+(a.img?"":" nopic")} key={a.link}>
                        <div className="txt">
                        <div className="kick">{feeds[a.topic]?.label||"Salvato"}</div>
                        <h2 className="hl"><a href={a.link} target="_blank" rel="noopener" onClick={()=>markRead(a.link)}>{a.title}</a></h2>
                        {a.snippet&&<p className="snip clamp3">{a.snippet}</p>}
                        <div className="meta">
                          <span style={{color:"var(--stamp)"}}>{a.source}</span>
                          <span className="dot">·</span><span>salvato {timeAgo(new Date(a.savedAt))}</span>
                          {read.has(a.link)&&<span className="letto">letto</span>}
                        </div>
                        <div className="acts">
                          <button className="primary" disabled={busy===a.link} onClick={()=>copySingle(art)}>{busy===a.link?"…":"Sintesi"}</button>
                          <span className="sep">·</span>
                          <button onClick={()=>openArticle(art)}>Apri ↗</button>
                          <span className="sep">·</span>
                          <button className={sel.has(a.link)?"on":""} onClick={()=>toggleSel(a.link)}>{sel.has(a.link)?"✓ digest":"+ digest"}</button>
                          <span className="sep">·</span>
                          <button onClick={()=>toggleSave(art)}>rimuovi</button>
                        </div>
                        </div>
                        <Figure a={art}/>
                      </div>
                    );
                  })}
                </div>
              </div>
            </>
          )}
        </div>
      )}

      {tab==="search" && (
        <div className="secview">
          <div className="searchbar">
            <input autoFocus value={query} onChange={e=>setQuery(e.target.value)}
              placeholder="Cerca tra le notizie salvate…" spellCheck="false" />
            {query && <button className="clr" onClick={()=>setQuery("")}>×</button>}
          </div>
          <div className="searchmeta">
            {query.trim().length<2
              ? `Archivio: ${archiveCount} notizie degli ultimi ${ARCH_DAYS} giorni`
              : `${results.length} risultati per “${query.trim()}”`}
          </div>
          {query.trim().length>=2 && results.length===0 && (
            <div className="empty"><b>Nessun risultato</b>La ricerca guarda solo le notizie che la Rassegna ha già visto. Prova un'altra parola o tieni l'app aperta più spesso.</div>
          )}
          {results.length>0 && (
            <div className="section" style={{borderTop:"2px solid var(--ink)",paddingTop:18}}>
              <div className="cols c3">{results.map(a=><Col key={a.link} a={a}/>)}</div>
            </div>
          )}
        </div>
      )}

      {tab===SP_TAB && <Sport/>}

      {tab!=="all" && tab!=="saved" && tab!=="search" && tab!==SP_TAB && (
        <div className="secview">
          {!loading && sectionArts.length===0 && <div className="empty"><b>Sezione vuota</b>Nessuna notizia qui adesso.</div>}
          {sectionArts.length>0 && (
            <>
              <div className="top"><Lead a={sectionArts[0]}/></div>
              <div className="section"><div className="cols c3">{sectionArts.slice(1).map(a=><Col key={a.link} a={a}/>)}</div></div>
            </>
          )}
        </div>
      )}

      {sel.size>0 && (
        <div className="selbar">
          <span className="txt">{sel.size} in digest</span>
          <div className="grp">
            <button onClick={()=>setSel(new Set())}>Annulla</button>
            <button className="go" onClick={copyDigest}>Copia digest →</button>
          </div>
        </div>
      )}

      {panel && (
        <>
          <div className="backdrop" onClick={()=>setPanel(null)}></div>
          <div className="panel">
            <header><div><div className="lbl">Pronto per Claude</div><h3>{panel.title}</h3></div><button className="x" onClick={()=>setPanel(null)}>×</button></header>
            <div className="content">
              <p className="hintline">Testo negli appunti. Apri Claude e incolla (Ctrl/Cmd+V). Se la copia non è partita, selezionalo dal riquadro.</p>
              <div className="promptbox">{panel.text}</div>
            </div>
            <div className="foot">
              <button onClick={recopy}>Copia di nuovo</button>
              <button className="go" onClick={()=>window.open(CLAUDE_URL,"_blank","noopener")}>Apri Claude ↗</button>
            </div>
          </div>
        </>
      )}

      {settings && <Settings feeds={feeds} widgets={widgets} onClose={()=>setSettings(false)} onCheckUpdate={controllaAggiornamenti} look={look} setLook={setLook}
        onSave={(nf,nw)=>{
          setFeeds(nf); localStorage.setItem(LS.feeds,JSON.stringify(nf));
          setWidgets(nw); localStorage.setItem(LS.widgets,JSON.stringify(nw));
          try{sessionStorage.removeItem("rassegna_wcache");}catch(e){}
          setSettings(false);
        }}/>}
      {toast && <div className="toast">{toast}</div>}
            {menu && (
              <>
                <div className="menu-veil" onClick={()=>setMenu(false)}></div>
                <div className="menu" role="menu">
                  <div className="menu-h">Sezioni</div>
                  <div className="menu-secs">
                    {[["all","Prima pagina"],[SP_TAB,"⚽ Risultati"],["saved","★ Da leggere"],["search","⌕ Cerca"],...order.map(t=>[t,feeds[t].label])].map(([id,lb])=>(
                      <button key={id} className={tab===id?"on":""} onClick={()=>{setTab(id);setMenu(false);window.scrollTo({top:0,behavior:"smooth"});}}>{lb}</button>
                    ))}
                  </div>
                  <div className="menu-h">Aspetto</div>
                  <div className="menu-seg">
                    <button className={theme==="day"?"on":""} onClick={()=>setTheme("day")}>☀ Mattina</button>
                    <button className={theme==="night"?"on":""} onClick={()=>setTheme("night")}>☾ Sera</button>
                  </div>
                  <div className="menu-seg">
                    <button className={look!=="modern"?"on":""} onClick={()=>setLook("classic")}>Classico</button>
                    <button className={look==="modern"?"on":""} onClick={()=>setLook("modern")}>Moderno</button>
                  </div>
                  <div className="menu-h">App</div>
                  <button className="menu-it" onClick={()=>{setMenu(false);setSettings(true);}}>⚙ Fonti e impostazioni</button>
                  <button className="menu-it" onClick={()=>{setMenu(false);controllaAggiornamenti();}}>⟳ Aggiorna app <small>{APP_BUILD}</small></button>
                  {FB && !user && <button className="menu-it acc" onClick={()=>{setMenu(false);signIn();}}>⇅ Sincronizza con Google</button>}
                  {FB && user && <button className="menu-it" onClick={()=>{setMenu(false);signOut();}}>Esci <small>{user.email||""}</small></button>}
                </div>
              </>
            )}
      {nuovaVersione && !updChiuso && (
        <div className="upd-veil" onClick={()=>setUpdChiuso(true)}>
          <div className="upd-pop" role="dialog" aria-modal="true" onClick={e=>e.stopPropagation()}>
            <div className="upd-kick">Rassegna · aggiornamento</div>
            <div className="upd-tit">Nuova versione disponibile</div>
            <div className="upd-txt">Su GitHub c'è un file più nuovo dell'app. Aggiorna per avere le ultime modifiche: notizie salvate e impostazioni restano.</div>
            <div className="upd-ver"><span>Installata <b>{APP_BUILD||"—"}</b></span><span>Nuova <b>{nuovaVersione}</b></span></div>
            <button className="upd-go" onClick={appRicarica}>⟳ Aggiorna ora</button>
            <button className="upd-later" onClick={()=>setUpdChiuso(true)}>Più tardi</button>
          </div>
        </div>
      )}
      {nuovaVersione && updChiuso && !updNascosto && (
        <div className="upd-banner">
          <span>Nuova versione disponibile</span>
          <button onClick={appRicarica}>Aggiorna</button>
          <button className="x" onClick={()=>setUpdNascosto(true)} aria-label="Chiudi">✕</button>
        </div>
      )}
    </div>
  );
}

function Settings({feeds,widgets,onClose,onSave,onCheckUpdate,look,setLook}){
  const toText=obj=>Object.entries(obj).map(([id,g])=>`[${g.label}]\n`+g.urls.join("\n")).join("\n\n");
  const [txt,setTxt]=useState(()=>toText(feeds));
  const [wtxt,setWtxt]=useState(()=>widgetsToText(widgets));
  const [testing,setTesting]=useState(false);
  const [res,setRes]=useState(null);
  const runTest=async()=>{ setTesting(true); setRes(null); try{ setRes(await testProxies()); }catch(e){} setTesting(false); };
  const [srv,setSrv]=useState(null); const [srvBusy,setSrvBusy]=useState(false);
  const runSrv=async()=>{ setSrvBusy(true); setSrv(null); try{ setSrv(await testServer(feeds)); }catch(e){} setSrvBusy(false); };

  const parse=(t)=>{
    const out={};let cur=null;
    (t||txt).split("\n").forEach(line=>{const l=line.trim();if(!l)return;const m=l.match(/^\[(.+)\]$/);
      if(m){const label=m[1].trim();const id=label.toLowerCase().replace(/[^a-z0-9]+/g,"").slice(0,20)||("t"+Object.keys(out).length);cur=id;out[id]={label,urls:[]};}
      else if(cur&&/^https?:\/\//.test(l)){out[cur].urls.push(l);}});
    return out;
  };
  const current=parse(txt);
  const activeLabels=new Set(Object.values(current).map(g=>g.label.toLowerCase()));
  const isOn=c=>activeLabels.has(c.label.toLowerCase());

  const toggle=(c)=>{
    if(isOn(c)){
      const next={}; Object.entries(current).forEach(([id,g])=>{ if(g.label.toLowerCase()!==c.label.toLowerCase()) next[id]=g; });
      setTxt(toText(next));
    } else {
      setTxt(t=>(t.trim()?t.trim()+"\n\n":"")+`[${c.label}]\n`+c.urls.join("\n"));
    }
  };

  const listRef=useRef(null);
  const [dragI,setDragI]=useState(null);
  const [overI,setOverI]=useState(null);
  const dragState=useRef(null);

  const startDrag=(e,i)=>{
    e.preventDefault();
    const rows=[...listRef.current.querySelectorAll(".ord")];
    dragState.current={ order:Object.entries(current), from:i,
      centers:rows.map(r=>{ const b=r.getBoundingClientRect(); return b.top+b.height/2; }) };
    setDragI(i); setOverI(i);
    e.target.setPointerCapture&&e.target.setPointerCapture(e.pointerId);
  };
  const onMove=(e)=>{
    if(!dragState.current) return;
    const y=e.clientY!=null?e.clientY:(e.touches&&e.touches[0]?e.touches[0].clientY:0);
    const c=dragState.current.centers;
    let k=0; while(k<c.length-1 && y>c[k]) k++;
    if(y<c[0]) k=0;
    setOverI(k);
  };
  const endDrag=()=>{
    const st=dragState.current;
    if(st && overI!=null && overI!==st.from){
      const ent=[...st.order];
      const [it]=ent.splice(st.from,1);
      ent.splice(overI,0,it);
      setTxt(toText(Object.fromEntries(ent)));
    }
    dragState.current=null; setDragI(null); setOverI(null);
  };
  useEffect(()=>{
    if(dragI===null) return;
    window.addEventListener("pointermove",onMove);
    window.addEventListener("pointerup",endDrag);
    window.addEventListener("pointercancel",endDrag);
    return ()=>{ window.removeEventListener("pointermove",onMove);
      window.removeEventListener("pointerup",endDrag);
      window.removeEventListener("pointercancel",endDrag); };
  }); // eslint-disable-line

  const move=(i,dir)=>{
    const ent=Object.entries(current); const j=i+dir;
    if(j<0||j>=ent.length) return;
    [ent[i],ent[j]]=[ent[j],ent[i]];
    setTxt(toText(Object.fromEntries(ent)));
  };
  const removeAt=(id)=>{
    const next={}; Object.entries(current).forEach(([k,v])=>{ if(k!==id) next[k]=v; });
    setTxt(toText(next));
  };
  const save=()=>{ const o=parse(txt); onSave(Object.keys(o).length?o:feeds, parseWidgets(wtxt)); };

  return (
    <>
      <div className="backdrop" onClick={onClose}></div>
      <div className="panel">
        <header><div><div className="lbl">Impostazioni</div><h3>Sezioni e fonti</h3></div><button className="x" onClick={onClose}>×</button></header>
        <div className="content set">
          <div className="setlbl">Ordine delle sezioni</div>
          <p className="hint">Trascina ⠿ per spostare. È l'ordine dei tab in alto e dei blocchi in prima pagina.</p>
          <div className="ordlist" ref={listRef}>
            {Object.entries(current).map(([id,g],i,arr)=>(
              <div className={"ord"+(dragI===i?" dragging":"")+(overI===i&&dragI!==null&&dragI!==i?" over":"")}
                   key={id} data-i={i}>
                <span className="grip" onPointerDown={e=>startDrag(e,i)} title="Trascina">⠿</span>
                <span className="nm">{g.label}</span>
                <span className="btns">
                  <button disabled={i===0} onClick={()=>move(i,-1)} title="Su">↑</button>
                  <button disabled={i===arr.length-1} onClick={()=>move(i,1)} title="Giù">↓</button>
                  <button className="rm" onClick={()=>removeAt(id)} title="Togli">×</button>
                </span>
              </div>
            ))}
            {Object.keys(current).length===0 && <div className="hint" style={{padding:"12px"}}>Nessuna sezione: accendine qualcuna qui sotto.</div>}
          </div>

          <div className="setlbl">Macroaree</div>
          <p className="hint">Clicca per aggiungere o togliere. Quelle accese finiscono nella barra in alto.</p>
          <div className="cat">
            {CATALOG.map(c=>(
              <button key={c.id} className={"chip"+(isOn(c)?" on":"")} onClick={()=>toggle(c)}>
                {isOn(c)?"✓ ":"+ "}{c.label}
              </button>
            ))}
          </div>

          <div className="setlbl">Aspetto</div>
          <div className="looks">
            <button className={look!=="modern"?"on":""} onClick={()=>setLook("classic")}><span className="pv c">Aa</span><small>Classico · giornale</small></button>
            <button className={look==="modern"?"on":""} onClick={()=>setLook("modern")}><span className="pv m">Aa</span><small>Moderno · schede</small></button>
          </div>
          <p className="hint">Si applica subito e vale su tutti i dispositivi sincronizzati.</p>

          <div className="setlbl">App</div>
          <p className="hint">Versione installata: <b style={{color:"var(--ink)"}}>{APP_BUILD||"—"}</b>. Se su GitHub c'è un file più nuovo, l'app lo scarica e si ricarica.</p>
          <button className="ib" style={{width:"100%",justifyContent:"center",padding:"9px"}} onClick={onCheckUpdate}>
            ⟳ Aggiorna app
          </button>

          <div className="setlbl">Server notizie</div>
          <p className="hint">Il tuo Worker Cloudflare scarica le fonti ogni 10 minuti: quando premi Aggiorna le notizie sono già pronte.</p>
          <button className="ib" style={{width:"100%",justifyContent:"center",padding:"9px"}} disabled={srvBusy} onClick={runSrv}>{srvBusy?"Controllo…":"Prova il server"}</button>
          {srv && <div className="hint" style={{marginTop:8,color:srv.ok?"var(--up)":"var(--stamp)"}}>{srv.ok?"✅ ":"⚠️ "}{srv.msg}</div>}

          <div className="setlbl">Diagnostica</div>
          <p className="hint">Se vedi "feed ko", i proxy pubblici stanno rifiutando le richieste. Prova quali rispondono adesso.</p>
          <button className="ib" style={{width:"100%",justifyContent:"center",padding:"9px"}} disabled={testing} onClick={runTest}>
            {testing?"Provo…":"Testa i proxy"}
          </button>
          <button className="ib" style={{width:"100%",justifyContent:"center",padding:"9px",marginTop:8}}
            onClick={()=>{ ["rassegna_cache","rassegna_proxy_name","rassegna_proxy_ok"].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});
              try{sessionStorage.clear()}catch(e){} location.reload(true); }}>
            Svuota cache e ricarica
          </button>
          {res && <div className="hint" style={{marginTop:10}}>
            {res.map(r=>(<div key={r.i}>{r.ok?"✅":"❌"} {r.name} <span style={{opacity:.6}}>({r.ms}ms{r.why?" — "+r.why:""})</span></div>))}
            <div style={{marginTop:8}}>Test su ANSA. Se il tuo Worker è ✅, sei a posto: le testate che restano ko bloccano di loro.</div>
          </div>}

          <div className="setlbl">Nastro in alto</div>
          <p className="hint">Una scheda per riga:<br/>
          <code>quote ^spx S&amp;P 500</code> · <code>topic Serie A calcio | Serie A</code> · <code>weather auto</code> (meteo dove sei) · <code>weather Reggio Emilia</code><br/>
          Nei temi l'argomento è tutta la frase; dopo <code>|</code> metti un'etichetta corta.<br/>
          Borsa: <code>^spx</code>, <code>^ndq</code>, <code>^dax</code>, <code>ftsemib</code>, <code>xauusd</code> (oro), <code>brent</code>. Titoli: <code>enel.it</code>, <code>aapl.us</code>. Valute: <code>eurusd</code>. Cripto: <code>btcusd</code>.</p>
          <textarea style={{minHeight:120}} value={wtxt} onChange={e=>setWtxt(e.target.value)} spellCheck="false"></textarea>
          <button className="ib" style={{width:"100%",justifyContent:"center",padding:"8px",marginTop:8}}
            onClick={()=>setWtxt(widgetsToText(DEFAULT_WIDGETS))}>Ripristina nastro predefinito</button>

          <div className="setlbl">Fonti (avanzato)</div>
          <p className="hint">L'ordine qui sotto è l'ordine delle sezioni. Una sezione per <code>[Nome]</code>, poi un URL RSS per riga. Puoi crearne di tue.</p>
          <textarea value={txt} onChange={e=>setTxt(e.target.value)} spellCheck="false"></textarea>
          <button className="ib" style={{width:"100%",justifyContent:"center",padding:"8px",marginTop:8}}
            onClick={()=>{ if(confirm("Rimettere le fonti predefinite (con Il Sole 24 Ore)? Le tue modifiche alle fonti verranno sostituite.")) setTxt(toText(DEFAULT_FEEDS)); }}>
            Ripristina fonti predefinite (con Il Sole)
          </button>
          <button className="save" onClick={save}>Salva e aggiorna</button>
        </div>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
